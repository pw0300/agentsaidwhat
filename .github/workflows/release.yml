name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check version and extract release notes
        run: node .github/scripts/release-notes.mjs "$RELEASE_TAG" release-notes.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Choose image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/pw0300/agentsaidwhat" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
      - name: Smoke test container
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: |
          docker run -d --name qa-smoke -p 127.0.0.1:5199:5199 "$IMAGE"
          trap 'docker logs qa-smoke; docker rm -f qa-smoke' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5199/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Publish npm package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:$RELEASE_TAG"
          docker tag "$IMAGE:$RELEASE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
