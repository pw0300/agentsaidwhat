<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Fault benchmark results: timing faults caught, content faults need an AI judge, ASR withdrawn as not measured." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <title>Fault benchmark results: timing faults caught, content faults need an AI judge, ASR withdrawn as not measured.</title>

  <!-- Canvas background -->
  <rect width="960" height="530" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="528" rx="15" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(0, 32)">
    <text x="480" y="0" font-size="20" fill="#0f172a" font-weight="800" text-anchor="middle" letter-spacing="-0.3">How good is the testbench itself? We measured it.</text>
    <text x="480" y="20" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">300 generated calls, 315 planted faults, 90 clean calls. Rule-based detectors only, no AI judge key.</text>
  </g>

  <!-- Main Benchmark Table Container -->
  <g transform="translate(36, 72)">
    <rect width="888" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Table Header Line -->
    <text x="24" y="22" font-size="10.5" fill="#94a3b8" font-weight="700" letter-spacing="0.5">PLANTED FAULT CATEGORY</text>
    <text x="280" y="22" font-size="10.5" fill="#94a3b8" font-weight="700" letter-spacing="0.5">DETECTION RECALL TRACK</text>
    <text x="686" y="22" font-size="10.5" fill="#94a3b8" font-weight="700" letter-spacing="0.5" text-anchor="end">SCORE</text>
    <text x="750" y="22" font-size="10.5" fill="#94a3b8" font-weight="700" letter-spacing="0.5">STATUS</text>
    <line x1="20" y1="30" x2="868" y2="30" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 1: Talked over the caller (36/36) -->
    <g transform="translate(24, 38)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Talked over caller</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#059669"/>
      <text x="700" y="15" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">36/36</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#059669"/>
      <text x="768" y="15" font-size="10.5" fill="#059669" font-weight="700" text-anchor="middle">CAUGHT 100%</text>
    </g>

    <!-- Row 2: Cut caller off (27/27) -->
    <g transform="translate(24, 65)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Cut caller off</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#059669"/>
      <text x="700" y="15" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">27/27</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#059669"/>
      <text x="768" y="15" font-size="10.5" fill="#059669" font-weight="700" text-anchor="middle">CAUGHT 100%</text>
    </g>

    <!-- Row 3: Long silence (30/30) -->
    <g transform="translate(24, 92)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Long silence</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#059669"/>
      <text x="700" y="15" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">30/30</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#059669"/>
      <text x="768" y="15" font-size="10.5" fill="#059669" font-weight="700" text-anchor="middle">CAUGHT 100%</text>
    </g>

    <!-- Row 4: Hung up early (26/26) -->
    <g transform="translate(24, 119)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Hung up early</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#059669"/>
      <text x="700" y="15" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">26/26</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#059669"/>
      <text x="768" y="15" font-size="10.5" fill="#059669" font-weight="700" text-anchor="middle">CAUGHT 100%</text>
    </g>

    <!-- Row 5: Repeated itself (1/29) -->
    <g transform="translate(24, 146)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Repeated itself</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="256" y="4" width="14" height="14" rx="7" fill="#d97706"/>
      <text x="700" y="15" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">1/29</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#d97706"/>
      <text x="768" y="15" font-size="10.5" fill="#d97706" font-weight="700" text-anchor="middle">WEAK (3%)</text>
    </g>

    <!-- Row 6: Wrong fact (0/28) -->
    <g transform="translate(24, 173)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Wrong fact</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <text x="700" y="15" font-size="12.5" fill="#64748b" font-weight="600" text-anchor="end">0/28</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#e11d48"/>
      <text x="768" y="15" font-size="10.5" fill="#e11d48" font-weight="700" text-anchor="middle">NEEDS AI JUDGE</text>
    </g>

    <!-- Row 7: Dodged question (0/27) -->
    <g transform="translate(24, 200)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Dodged question</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <text x="700" y="15" font-size="12.5" fill="#64748b" font-weight="600" text-anchor="end">0/27</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#e11d48"/>
      <text x="768" y="15" font-size="10.5" fill="#e11d48" font-weight="700" text-anchor="middle">NEEDS AI JUDGE</text>
    </g>

    <!-- Row 8: Ignored language switch (0/27) -->
    <g transform="translate(24, 227)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Ignored language switch</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <text x="700" y="15" font-size="12.5" fill="#64748b" font-weight="600" text-anchor="end">0/27</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#e11d48"/>
      <text x="768" y="15" font-size="10.5" fill="#e11d48" font-weight="700" text-anchor="middle">NEEDS AI JUDGE</text>
    </g>

    <!-- Row 9: Invented a policy (0/33) -->
    <g transform="translate(24, 254)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Invented a policy</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <text x="700" y="15" font-size="12.5" fill="#64748b" font-weight="600" text-anchor="end">0/33</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#e11d48"/>
      <text x="768" y="15" font-size="10.5" fill="#e11d48" font-weight="700" text-anchor="middle">NEEDS AI JUDGE</text>
    </g>

    <!-- Row 10: Claimed success unconfirmed (0/28) -->
    <g transform="translate(24, 281)">
      <text x="0" y="15" font-size="13" fill="#0f172a" font-weight="600">Claimed success unconfirmed</text>
      <rect x="256" y="4" width="380" height="14" rx="7" fill="#e2e8f0"/>
      <text x="700" y="15" font-size="12.5" fill="#64748b" font-weight="600" text-anchor="end">0/28</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <circle cx="722" cy="11" r="3" fill="#e11d48"/>
      <text x="768" y="15" font-size="10.5" fill="#e11d48" font-weight="700" text-anchor="middle">NEEDS AI JUDGE</text>
    </g>

    <!-- Row 11: ASR mis-hearing (Withdrawn) -->
    <g transform="translate(24, 308)">
      <text x="0" y="15" font-size="13" fill="#64748b" font-weight="600">ASR mis-hearing</text>
      <text x="256" y="15" font-size="11.5" fill="#64748b" font-style="italic">NOT MEASURED: synthetic data made it circular, so we withdrew the score.</text>
      <rect x="710" y="1" width="114" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="768" y="15" font-size="10.5" fill="#64748b" font-weight="700" text-anchor="middle">WITHDRAWN</text>
    </g>
  </g>

  <!-- Summary Metric Cards -->
  <g transform="translate(36, 424)">
    <!-- Metric 1: Clean calls -->
    <g transform="translate(0, 0)">
      <rect width="436" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="23" r="13" fill="#ecfdf5"/>
      <path d="M21 23 L24 26 L30 20" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="27" font-size="13" fill="#0f172a" font-weight="700">0 false alarms on 90 clean calls</text>
    </g>

    <!-- Metric 2: Blame accuracy -->
    <g transform="translate(452, 0)">
      <rect width="436" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="23" r="13" fill="#eff6ff"/>
      <!-- Target icon -->
      <circle cx="26" cy="23" r="6" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="2" fill="#2563eb"/>
      <text x="48" y="27" font-size="13" fill="#0f172a" font-weight="700">Right layer blamed 78% of the time when it catches a fault</text>
    </g>
  </g>

  <!-- Caveat Footer Banner -->
  <g transform="translate(36, 480)">
    <rect width="888" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="16" r="6.5" fill="#94a3b8"/>
    <text x="20" y="20" font-size="10" fill="#ffffff" font-weight="800" text-anchor="middle">i</text>
    <text x="36" y="20" font-size="12" fill="#475569" font-weight="500">Synthetic calls are easier than real ones; timing scores are an upper bound.</text>
  </g>
</svg>