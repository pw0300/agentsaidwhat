<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" role="img"><title>Data flow: what goes where, and what never leaves your machine</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="556" rx="16" fill="#f8fafc"/>
<text x="32" y="44" font-size="20" font-weight="800" fill="#1f2937">Where your data goes</text>
<text x="32" y="66" font-size="13" fill="#6b7280">Everything runs and stays on your machine. PII is redacted before anything is stored or sent.</text>
<rect x="40" y="110" width="190" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="40" y="110" width="5" height="64" rx="2" fill="#2563eb"/><text x="56" y="138.5" font-size="14" font-weight="700" fill="#1f2937">Browser app</text><text x="56" y="156.5" font-size="11.5" fill="#6b7280">Log, triage, issues, gate</text><rect x="40" y="200" width="190" height="64" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="40" y="200" width="5" height="64" rx="2" fill="#7c3aed"/><text x="56" y="228.5" font-size="14" font-weight="700" fill="#1f2937">saidwhat CLI</text><text x="56" y="246.5" font-size="11.5" fill="#6b7280">run, gate, bench</text><rect x="40" y="290" width="190" height="64" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="40" y="290" width="5" height="64" rx="2" fill="#7c3aed"/><text x="56" y="318.5" font-size="14" font-weight="700" fill="#1f2937">GitHub Action</text><text x="56" y="336.5" font-size="11.5" fill="#6b7280">Gate a release in CI</text><rect x="40" y="420" width="190" height="64" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><rect x="40" y="420" width="5" height="64" rx="2" fill="#475569"/><text x="56" y="448.5" font-size="14" font-weight="700" fill="#1f2937">Your voice agent</text><text x="56" y="466.5" font-size="11.5" fill="#6b7280">WebSocket or HTTP endpoint</text><line x1="160" y1="358" x2="160" y2="416" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="186" y="392" font-size="10.5" fill="#6b7280" text-anchor="middle">calls</text><line x1="110" y1="416" x2="110" y2="358" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="82" y="392" font-size="10.5" fill="#6b7280" text-anchor="middle">replies</text><rect x="300" y="96" width="330" height="400" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="320" y="124" font-size="15" font-weight="800" fill="#1f2937">Local server (one Node process)</text><text x="320" y="142" font-size="11.5" fill="#6b7280">Binds to localhost. Rejects cross-site writes and spoofed hosts.</text><rect x="320" y="160" width="290" height="60" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/><rect x="320" y="160" width="5" height="60" rx="2" fill="#e11d48"/><text x="336" y="186.5" font-size="14" font-weight="700" fill="#1f2937">1. Redact PII on the way in</text><text x="336" y="204.5" font-size="11.5" fill="#6b7280">Phone, PAN, Aadhaar, UPI, email, spoken digits</text><rect x="320" y="236" width="290" height="60" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="320" y="236" width="5" height="60" rx="2" fill="#2563eb"/><text x="336" y="262.5" font-size="14" font-weight="700" fill="#1f2937">2. Score and attribute</text><text x="336" y="280.5" font-size="11.5" fill="#6b7280">Timing rules, rubric, layer and owner</text><rect x="320" y="312" width="290" height="60" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><rect x="320" y="312" width="5" height="60" rx="2" fill="#059669"/><text x="336" y="338.5" font-size="14" font-weight="700" fill="#1f2937">3. Gate</text><text x="336" y="356.5" font-size="11.5" fill="#6b7280">Floors, blockers, sample size, regression</text><rect x="320" y="388" width="290" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><rect x="320" y="388" width="5" height="90" rx="2" fill="#d97706"/><text x="336" y="414.5" font-size="14" font-weight="700" fill="#1f2937">Optional AI judge</text><text x="336" y="432.5" font-size="11.5" fill="#6b7280">Only with your own API key.</text><text x="336" y="447.5" font-size="11.5" fill="#6b7280">Prompts redacted, budget capped.</text><text x="336" y="462.5" font-size="11.5" fill="#6b7280">Without a key: NOT MEASURED</text><line x1="465" y1="220" x2="465" y2="232" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="465" y1="296" x2="465" y2="308" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="230" y1="142" x2="316" y2="186" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="230" y1="232" x2="316" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="230" y1="322" x2="316" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><rect x="700" y="96" width="230" height="250" rx="14" fill="#ffffff" stroke="#e5e7eb"/><text x="718" y="124" font-size="15" font-weight="800" fill="#1f2937">On your disk</text><rect x="718" y="140" width="194" height="64" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><rect x="718" y="140" width="5" height="64" rx="2" fill="#475569"/><text x="734" y="168.5" font-size="14" font-weight="700" fill="#1f2937">SQLite</text><text x="734" y="186.5" font-size="11.5" fill="#6b7280">Every revision kept</text><rect x="718" y="220" width="194" height="64" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><rect x="718" y="220" width="5" height="64" rx="2" fill="#475569"/><text x="734" y="248.5" font-size="14" font-weight="700" fill="#1f2937">Audio folder</text><text x="734" y="266.5" font-size="11.5" fill="#6b7280">Recordings stay local</text><text x="718" y="314" font-size="11.5" fill="#6b7280">Deletes are tombstoned, so a stale</text><text x="718" y="329" font-size="11.5" fill="#6b7280">tab cannot bring data back.</text><line x1="610" y1="180" x2="714" y2="172" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="662" y="166" font-size="10.5" fill="#6b7280" text-anchor="middle">redacted</text><line x1="610" y1="205" x2="714" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><rect x="700" y="372" width="230" height="124" rx="14" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/><text x="718" y="398" font-size="13" font-weight="800" fill="#d97706">Only thing that can leave</text><text x="718" y="420" font-size="11.5" fill="#1f2937">Redacted text sent to the AI</text><text x="718" y="437" font-size="11.5" fill="#1f2937">judge you configured, if any.</text><text x="718" y="454" font-size="11.5" fill="#1f2937">Audio never leaves the machine.</text><text x="718" y="471" font-size="11.5" fill="#1f2937">No account, no telemetry.</text><line x1="610" y1="433" x2="696" y2="433" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="32" y="530" font-size="11.5" fill="#6b7280">Hosted mode (Vercel + Upstash Redis) runs the same handlers with accounts and an audit log. It is experimental until it has an outside security review.</text></svg>