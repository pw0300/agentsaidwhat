<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="The voice stack: telephony, ASR, VAD, LLM and prompt, TTS. Each failure maps to the team that owns that layer." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <title>The voice stack: telephony, ASR, VAD, LLM and prompt, TTS. Each failure maps to the team that owns that layer.</title>
  <defs>
    <!-- Arrowhead markers for each layer color -->
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="960" height="450" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="448" rx="15" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(0, 30)">
    <text x="480" y="0" font-size="20" fill="#0f172a" font-weight="800" text-anchor="middle" letter-spacing="-0.3">Every failure has an owner</text>
    <text x="480" y="22" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">A voice agent is a stack. A complaint is not a ticket until it names the layer, and the team that can fix it.</text>
  </g>

  <!-- Column Labels -->
  <g transform="translate(0, 80)">
    <text x="40" y="0" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="0.6">STACK LAYER &amp; FAILURE SYMPTOM</text>
    <text x="560" y="0" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="0.6">ACCOUNTABLE OWNER</text>
  </g>

  <!-- Row 1: Telephony -->
  <g transform="translate(0, 94)">
    <!-- Layer card -->
    <rect x="40" y="0" width="460" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="52" rx="2" fill="#475569"/>
    
    <!-- Icon -->
    <circle cx="68" cy="26" r="14" fill="#f1f5f9"/>
    <path d="M63 29 C63 24 67 20 73 20 M63 29 C63 26 65 24 68 24" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="63" cy="29" r="2" fill="#475569"/>

    <text x="94" y="22" font-size="14" fill="#0f172a" font-weight="700">Telephony</text>
    <text x="94" y="38" font-size="11.5" fill="#64748b" font-weight="400">line drops, noise, latency</text>

    <!-- Connector arrow -->
    <line x1="500" y1="26" x2="552" y2="26" stroke="#475569" stroke-width="1.8" marker-end="url(#arrSlate)"/>

    <!-- Owner card -->
    <rect x="560" y="0" width="360" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="578" y="20" font-size="10" fill="#64748b" font-weight="700" letter-spacing="0.4">OWNER</text>
    <text x="578" y="38" font-size="13.5" fill="#0f172a" font-weight="700">Telephony provider / network</text>
  </g>

  <!-- Row 2: ASR -->
  <g transform="translate(0, 154)">
    <rect x="40" y="0" width="460" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="52" rx="2" fill="#2563eb"/>

    <circle cx="68" cy="26" r="14" fill="#dbeafe"/>
    <!-- Mic icon -->
    <rect x="65" y="19" width="6" height="10" rx="3" fill="#2563eb"/>
    <path d="M62 25 A6 6 0 0 0 74 25 M68 31 V34 M65 34 H71" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round"/>

    <text x="94" y="22" font-size="14" fill="#0f172a" font-weight="700">ASR (speech to text)</text>
    <text x="94" y="38" font-size="11.5" fill="#475569" font-weight="500">heard 'na ji' when caller said 'haanji'</text>

    <line x1="500" y1="26" x2="552" y2="26" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>

    <rect x="560" y="0" width="360" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="578" y="20" font-size="10" fill="#2563eb" font-weight="700" letter-spacing="0.4">OWNER</text>
    <text x="578" y="38" font-size="13.5" fill="#0f172a" font-weight="700">Platform / ASR configuration</text>
  </g>

  <!-- Row 3: VAD / turn-taking -->
  <g transform="translate(0, 214)">
    <rect x="40" y="0" width="460" height="52" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="52" rx="2" fill="#7c3aed"/>

    <circle cx="68" cy="26" r="14" fill="#ede9fe"/>
    <!-- Turn taking overlap bars -->
    <rect x="62" y="21" width="10" height="3.5" rx="1" fill="#7c3aed"/>
    <rect x="66" y="27" width="10" height="3.5" rx="1" fill="#a78bfa"/>

    <text x="94" y="22" font-size="14" fill="#0f172a" font-weight="700">VAD / turn-taking</text>
    <text x="94" y="38" font-size="11.5" fill="#475569" font-weight="500">cut the caller off, talked over them</text>

    <line x1="500" y1="26" x2="552" y2="26" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrViolet)"/>

    <rect x="560" y="0" width="360" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="578" y="20" font-size="10" fill="#7c3aed" font-weight="700" letter-spacing="0.4">OWNER</text>
    <text x="578" y="38" font-size="13.5" fill="#0f172a" font-weight="700">Turn-taking / VAD thresholds</text>
  </g>

  <!-- Row 4: LLM + prompt -->
  <g transform="translate(0, 274)">
    <rect x="40" y="0" width="460" height="52" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
    <rect x="40" y="0" width="4" height="52" rx="2" fill="#e11d48"/>

    <circle cx="68" cy="26" r="14" fill="#ffe4e6"/>
    <!-- Brain / prompt spark icon -->
    <path d="M68 19 L70 24 L75 26 L70 28 L68 33 L66 28 L61 26 L66 24 Z" fill="#e11d48"/>

    <text x="94" y="22" font-size="14" fill="#0f172a" font-weight="700">LLM + prompt</text>
    <text x="94" y="38" font-size="11.5" fill="#e11d48" font-weight="500">wrong fact, invented policy, dodged question</text>

    <line x1="500" y1="26" x2="552" y2="26" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrRed)"/>

    <rect x="560" y="0" width="360" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="578" y="20" font-size="10" fill="#e11d48" font-weight="700" letter-spacing="0.4">OWNER</text>
    <text x="578" y="38" font-size="13.5" fill="#0f172a" font-weight="700">Prompt engineering</text>
  </g>

  <!-- Row 5: TTS / voice -->
  <g transform="translate(0, 334)">
    <rect x="40" y="0" width="460" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="52" rx="2" fill="#d97706"/>

    <circle cx="68" cy="26" r="14" fill="#fef3c7"/>
    <!-- Speaker icon -->
    <path d="M63 24 H66 L70 20 V32 L66 28 H63 Z" fill="#d97706"/>
    <path d="M72 23 C73.5 24.5 73.5 27.5 72 29" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>

    <text x="94" y="22" font-size="14" fill="#0f172a" font-weight="700">TTS / voice</text>
    <text x="94" y="38" font-size="11.5" fill="#92400e" font-weight="500">mispronounced the amount, robotic pace</text>

    <line x1="500" y1="26" x2="552" y2="26" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>

    <rect x="560" y="0" width="360" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="578" y="20" font-size="10" fill="#d97706" font-weight="700" letter-spacing="0.4">OWNER</text>
    <text x="578" y="38" font-size="13.5" fill="#0f172a" font-weight="700">Voice &amp; TTS settings</text>
  </g>

  <!-- Bottom Fallback Callout -->
  <g transform="translate(180, 402)">
    <rect width="600" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Person / investigation icon -->
    <circle cx="24" cy="16" r="9" fill="#eff6ff"/>
    <circle cx="24" cy="13.5" r="3" fill="#2563eb"/>
    <path d="M19 21 C19 19 21 17.5 24 17.5 C27 17.5 29 19 29 21" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="20.5" font-size="12" fill="#475569" font-weight="500">Not sure? It says <tspan fill="#0f172a" font-weight="700">'Unattributed: needs a human'</tspan> instead of guessing.</text>
  </g>
</svg>