<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="v2 improves the average from 3.3 to 4.0 but accuracy drops from 4 to 2. The gate fails it." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <title>v2 improves the average from 3.3 to 4.0 but accuracy drops from 4 to 2. The gate fails it.</title>
  <defs>
    <linearGradient id="barGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="barMuted" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="960" height="340" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="338" rx="15" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(0, 32)">
    <text x="480" y="0" font-size="20" fill="#0f172a" font-weight="800" text-anchor="middle" letter-spacing="-0.3">Why a dashboard average is not a release gate</text>
    <text x="480" y="20" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">Same 30 calls per version. Two scores improve, the one that matters collapses.</text>
  </g>

  <!-- Left: Comparative Bar Chart Card -->
  <g transform="translate(40, 68)">
    <rect width="516" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Legend -->
    <g transform="translate(330, 16)">
      <rect x="0" y="2" width="12" height="12" rx="3" fill="#94a3b8"/>
      <text x="18" y="12" font-size="11" fill="#475569" font-weight="600">v1 (baseline)</text>
      <rect x="100" y="2" width="12" height="12" rx="3" fill="#059669"/>
      <text x="118" y="12" font-size="11" fill="#475569" font-weight="600">v2 (candidate)</text>
    </g>

    <!-- Y-axis scale lines -->
    <g stroke="#e2e8f0" stroke-width="1">
      <!-- 5 -->
      <line x1="50" y1="50" x2="490" y2="50" stroke-dasharray="3 3"/>
      <text x="36" y="54" font-size="10.5" fill="#94a3b8" font-weight="600" text-anchor="end">5.0</text>
      <!-- 4 -->
      <line x1="50" y1="85" x2="490" y2="85" stroke-dasharray="3 3"/>
      <text x="36" y="89" font-size="10.5" fill="#94a3b8" font-weight="600" text-anchor="end">4.0</text>
      <!-- 3 -->
      <line x1="50" y1="120" x2="490" y2="120" stroke-dasharray="3 3"/>
      <text x="36" y="124" font-size="10.5" fill="#94a3b8" font-weight="600" text-anchor="end">3.0</text>
      <!-- 2 -->
      <line x1="50" y1="155" x2="490" y2="155" stroke-dasharray="3 3"/>
      <text x="36" y="159" font-size="10.5" fill="#94a3b8" font-weight="600" text-anchor="end">2.0</text>
      <!-- Baseline -->
      <line x1="50" y1="190" x2="490" y2="190" stroke="#cbd5e1" stroke-width="1.2"/>
    </g>

    <!-- Red Accuracy Floor Line -->
    <line x1="50" y1="85" x2="200" y2="85" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="4 2"/>
    <rect x="152" y="70" width="102" height="14" rx="3" fill="#fff1f2"/>
    <text x="203" y="81" font-size="9" fill="#e11d48" font-weight="700" text-anchor="middle">Accuracy floor (4.0)</text>

    <!-- Group 1: Accuracy (v1: 4, v2: 2) -->
    <g transform="translate(85, 0)">
      <!-- v1 bar: score 4 -> height 105 (190-85) -->
      <rect x="0" y="85" width="36" height="105" rx="5" fill="url(#barMuted)"/>
      <text x="18" y="77" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">4</text>
      <text x="18" y="180" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">v1</text>

      <!-- v2 bar: score 2 -> height 35 (190-155) -->
      <rect x="42" y="155" width="36" height="35" rx="5" fill="url(#barRed)"/>
      <text x="60" y="147" font-size="12" fill="#e11d48" font-weight="800" text-anchor="middle">2</text>
      <text x="60" y="177" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">v2</text>

      <text x="39" y="208" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">Accuracy</text>
      <text x="39" y="221" font-size="10" fill="#e11d48" font-weight="700" text-anchor="middle">4 to 2</text>
    </g>

    <!-- Group 2: Naturalness (v1: 3, v2: 5) -->
    <g transform="translate(235, 0)">
      <!-- v1 bar: score 3 -> height 70 (190-120) -->
      <rect x="0" y="120" width="36" height="70" rx="5" fill="url(#barMuted)"/>
      <text x="18" y="112" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">3</text>
      <text x="18" y="180" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">v1</text>

      <!-- v2 bar: score 5 -> height 140 (190-50) -->
      <rect x="42" y="50" width="36" height="140" rx="5" fill="url(#barGreen)"/>
      <text x="60" y="42" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">5</text>
      <text x="60" y="180" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">v2</text>

      <text x="39" y="208" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">Naturalness</text>
      <text x="39" y="221" font-size="10" fill="#059669" font-weight="700" text-anchor="middle">3 to 5</text>
    </g>

    <!-- Group 3: Recovery (v1: 3, v2: 5) -->
    <g transform="translate(385, 0)">
      <!-- v1 bar: score 3 -> height 70 (190-120) -->
      <rect x="0" y="120" width="36" height="70" rx="5" fill="url(#barMuted)"/>
      <text x="18" y="112" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">3</text>
      <text x="18" y="180" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">v1</text>

      <!-- v2 bar: score 5 -> height 140 (190-50) -->
      <rect x="42" y="50" width="36" height="140" rx="5" fill="url(#barGreen)"/>
      <text x="60" y="42" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">5</text>
      <text x="60" y="180" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">v2</text>

      <text x="39" y="208" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">Recovery</text>
      <text x="39" y="221" font-size="10" fill="#059669" font-weight="700" text-anchor="middle">3 to 5</text>
    </g>
  </g>

  <!-- Right: Decision Cards -->
  <g transform="translate(576, 68)">
    <!-- Dashboard Card (Deceptive Pass) -->
    <g transform="translate(0, 0)">
      <rect width="344" height="106" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
      
      <!-- Trend up icon -->
      <circle cx="28" cy="28" r="12" fill="#d1fae5"/>
      <path d="M22 32 L27 27 L30 30 L35 24 M31 24 H35 V28" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="50" y="24" font-size="10.5" fill="#059669" font-weight="700" letter-spacing="0.4">NAIVE AVERAGE</text>
      <text x="50" y="46" font-size="19" fill="#0f172a" font-weight="800">Average: 3.3  →  4.0</text>
      
      <rect x="20" y="64" width="168" height="26" rx="6" fill="#059669"/>
      <text x="104" y="81" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Dashboard says: ship it.</text>
      <text x="198" y="81" font-size="11" fill="#047857" font-weight="500">Deceptive aggregate</text>
    </g>

    <!-- Gate Card (Hard Failure) -->
    <g transform="translate(0, 124)">
      <rect width="344" height="106" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
      
      <!-- Shield warning icon -->
      <circle cx="28" cy="28" r="12" fill="#ffe4e6"/>
      <path d="M24 24 L32 32 M32 24 L24 32" stroke="#e11d48" stroke-width="1.6" stroke-linecap="round"/>

      <text x="50" y="24" font-size="10.5" fill="#e11d48" font-weight="700" letter-spacing="0.4">SAFETY GATE FLOOR</text>
      <text x="50" y="46" font-size="19" fill="#0f172a" font-weight="800">Accuracy floor: 4  →  2</text>
      
      <rect x="20" y="64" width="206" height="26" rx="6" fill="#e11d48"/>
      <text x="123" y="81" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Gate says: FAIL. Do not ship.</text>
      <text x="236" y="81" font-size="11" fill="#be123c" font-weight="600">Blocks release</text>
    </g>
  </g>

  <!-- Bottom Context Line -->
  <text x="480" y="322" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle">Real output of bench/run.mjs gate validation: 30 calls per version.</text>
</svg>