<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" width="960" height="676" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" role="img"><title>User flows: manual logging, automated runs, and the fix loop</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="676" rx="16" fill="#f8fafc"/>
<text x="32" y="44" font-size="20" font-weight="800" fill="#1f2937">Two ways in, one place to decide</text>
<text x="32" y="66" font-size="13" fill="#6b7280">Testers log real calls; CI runs simulated ones. Both land on the same scorecard and the same gate.</text>
<rect x="20" y="88" width="920" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="112" font-size="12" font-weight="800" fill="#2563eb" letter-spacing="1">MANUAL: A TESTER LOGS A REAL CALL</text><rect x="40" y="128" width="150" height="62" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="40" y="128" width="5" height="62" rx="2" fill="#2563eb"/><text x="56" y="148.0" font-size="14" font-weight="700" fill="#1f2937">Log a call</text><text x="56" y="166.0" font-size="11.5" fill="#6b7280">Recording + transcript</text><text x="56" y="181.0" font-size="11.5" fill="#6b7280">on one screen</text><rect x="215" y="128" width="150" height="62" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="215" y="128" width="5" height="62" rx="2" fill="#2563eb"/><text x="231" y="148.0" font-size="14" font-weight="700" fill="#1f2937">Rate 1 to 5</text><text x="231" y="166.0" font-size="11.5" fill="#6b7280">Pinned to the exact</text><text x="231" y="181.0" font-size="11.5" fill="#6b7280">prompt version</text><rect x="390" y="128" width="150" height="62" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="390" y="128" width="5" height="62" rx="2" fill="#2563eb"/><text x="406" y="148.0" font-size="14" font-weight="700" fill="#1f2937">Pin notes</text><text x="406" y="166.0" font-size="11.5" fill="#6b7280">Went right / wrong</text><text x="406" y="181.0" font-size="11.5" fill="#6b7280">at a timestamp</text><rect x="565" y="128" width="150" height="62" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="565" y="128" width="5" height="62" rx="2" fill="#d97706"/><text x="581" y="148.0" font-size="14" font-weight="700" fill="#1f2937">PM triages</text><text x="581" y="166.0" font-size="11.5" fill="#6b7280">Accept, reject</text><text x="581" y="181.0" font-size="11.5" fill="#6b7280">or ask the tester</text><rect x="740" y="128" width="150" height="62" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.6"/><rect x="740" y="128" width="5" height="62" rx="2" fill="#e11d48"/><text x="756" y="148.0" font-size="14" font-weight="700" fill="#1f2937">Issue + owner</text><text x="756" y="166.0" font-size="11.5" fill="#6b7280">Layer decides</text><text x="756" y="181.0" font-size="11.5" fill="#6b7280">which team fixes it</text><line x1="190" y1="159.0" x2="211" y2="159.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="365" y1="159.0" x2="386" y2="159.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="540" y1="159.0" x2="561" y2="159.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="715" y1="159.0" x2="736" y2="159.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="224" font-size="11.5" fill="#6b7280">Keyboard first: Ctrl+K jumps anywhere, 1 to 5 rates, g / b pins a note, Ctrl+Enter saves. A tester view hides everything except scoring.</text><rect x="20" y="296" width="920" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="320" font-size="12" font-weight="800" fill="#7c3aed" letter-spacing="1">AUTOMATED: CI CALLS THE AGENT FOR YOU</text><rect x="40" y="336" width="150" height="62" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="40" y="336" width="5" height="62" rx="2" fill="#7c3aed"/><text x="56" y="356.0" font-size="14" font-weight="700" fill="#1f2937">Scenario pack</text><text x="56" y="374.0" font-size="11.5" fill="#6b7280">YAML: persona, goal,</text><text x="56" y="389.0" font-size="11.5" fill="#6b7280">language, criteria</text><rect x="215" y="336" width="150" height="62" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="215" y="336" width="5" height="62" rx="2" fill="#7c3aed"/><text x="231" y="356.0" font-size="14" font-weight="700" fill="#1f2937">saidwhat run</text><text x="231" y="374.0" font-size="11.5" fill="#6b7280">Simulated caller</text><text x="231" y="389.0" font-size="11.5" fill="#6b7280">over WS or HTTP</text><rect x="390" y="336" width="150" height="62" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="390" y="336" width="5" height="62" rx="2" fill="#7c3aed"/><text x="406" y="356.0" font-size="14" font-weight="700" fill="#1f2937">Score</text><text x="406" y="374.0" font-size="11.5" fill="#6b7280">Timing rules always,</text><text x="406" y="389.0" font-size="11.5" fill="#6b7280">AI judge if keyed</text><rect x="565" y="336" width="150" height="62" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><rect x="565" y="336" width="5" height="62" rx="2" fill="#475569"/><text x="581" y="356.0" font-size="14" font-weight="700" fill="#1f2937">Scorecard</text><text x="581" y="374.0" font-size="11.5" fill="#6b7280">Labelled simulated,</text><text x="581" y="389.0" font-size="11.5" fill="#6b7280">never counted as human</text><rect x="740" y="336" width="150" height="62" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><rect x="740" y="336" width="5" height="62" rx="2" fill="#059669"/><text x="756" y="356.0" font-size="14" font-weight="700" fill="#1f2937">Gate</text><text x="756" y="374.0" font-size="11.5" fill="#6b7280">Exit 0 pass, 1 fail,</text><text x="756" y="389.0" font-size="11.5" fill="#6b7280">2 inconclusive</text><line x1="190" y1="367.0" x2="211" y2="367.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="365" y1="367.0" x2="386" y2="367.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="540" y1="367.0" x2="561" y2="367.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="715" y1="367.0" x2="736" y2="367.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="432" font-size="11.5" fill="#6b7280">No judge key? Content checks report NOT MEASURED instead of passing. Too few calls gives INCONCLUSIVE.</text><rect x="20" y="504" width="920" height="150" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="528" font-size="12" font-weight="800" fill="#059669" letter-spacing="1">BOTH MEET HERE: A FIX IS A CLAIM UNTIL A RE-TEST PROVES IT</text><rect x="40" y="548" width="200" height="62" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.6"/><rect x="40" y="548" width="5" height="62" rx="2" fill="#e11d48"/><text x="56" y="575.5" font-size="14" font-weight="700" fill="#1f2937">Issue open</text><text x="56" y="593.5" font-size="11.5" fill="#6b7280">Owned by one layer</text><rect x="265" y="548" width="200" height="62" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="265" y="548" width="5" height="62" rx="2" fill="#d97706"/><text x="281" y="568.0" font-size="14" font-weight="700" fill="#1f2937">Ship v13</text><text x="281" y="586.0" font-size="11.5" fill="#6b7280">Ticks the issues</text><text x="281" y="601.0" font-size="11.5" fill="#6b7280">it claims to fix</text><rect x="490" y="548" width="200" height="62" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="490" y="548" width="5" height="62" rx="2" fill="#2563eb"/><text x="506" y="568.0" font-size="14" font-weight="700" fill="#1f2937">Re-test on v13</text><text x="506" y="586.0" font-size="11.5" fill="#6b7280">Tester records fixed,</text><text x="506" y="601.0" font-size="11.5" fill="#6b7280">not fixed or partial</text><rect x="715" y="548" width="200" height="62" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><rect x="715" y="548" width="5" height="62" rx="2" fill="#059669"/><text x="731" y="568.0" font-size="14" font-weight="700" fill="#1f2937">Verified fixed</text><text x="731" y="586.0" font-size="11.5" fill="#6b7280">Or reopened, with the</text><text x="731" y="601.0" font-size="11.5" fill="#6b7280">version it failed on</text><line x1="240" y1="579.0" x2="261" y2="579.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="465" y1="579.0" x2="486" y2="579.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><line x1="690" y1="579.0" x2="711" y2="579.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/></svg>